name: PEMS common camera admitted regeneration

on:
  push:
    branches:
      - pems-common-camera-reconciliation
    paths:
      - .github/workflows/pems-common-camera-reconciliation.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch accepted frozen tooling
        run: |
          git fetch origin post-cutover-admitted-regeneration
          mkdir -p /tmp/frozen
          git archive origin/post-cutover-admitted-regeneration tools | tar -x -C /tmp/frozen
      - name: Install frozen representation dependencies
        run: |
          python -m pip install -r /tmp/frozen/tools/pems/requirements.txt -r /tmp/frozen/tools/cove/requirements.txt pytest
      - name: Regenerate and validate Steward-admitted 171-record corpus
        env:
          PYTHONPATH: /tmp/frozen
        run: |
          python - <<'PY'
          from __future__ import annotations
          import copy
          import hashlib
          import json
          from pathlib import Path

          from tools.pems.pems_v1 import normalize_document, validate_schema, validate_semantics, semantic_identity
          from tools.pems.human_export import render_human_markdown
          from tools.cove.cove_v1 import encode, decode
          from tools.cove.jcs_v1 import canonicalize, serialize_cove, parse_canonical

          ROOT = Path('.')
          BASE_COUNT = 165
          FINAL_COUNT = 171
          DEMO_ID = 'pems:module:061c66bad77ea6d99dba'
          COMMON_ID = 'pems:module:eaaab2a3f3fa97c20c14'
          MAPPINGS = {
              'candidate:decision:67382908d8412fbf07f4': 'pems:decision:67382908d8412fbf07f4',
              'candidate:module:eaaab2a3f3fa97c20c14': 'pems:module:eaaab2a3f3fa97c20c14',
              'candidate:source:97de8d13bb3c828825ca': 'pems:source:97de8d13bb3c828825ca',
              'candidate:source:b90ade59f2af09d4d04c': 'pems:source:b90ade59f2af09d4d04c',
              'candidate:source_observation:52b293d43756079b5c0f': 'pems:source_observation:52b293d43756079b5c0f',
              'candidate:source_observation:8b224fe848a009ff335f': 'pems:source_observation:8b224fe848a009ff335f',
          }

          def remap(value):
              if isinstance(value, str):
                  return MAPPINGS.get(value, value)
              if isinstance(value, list):
                  return [remap(item) for item in value]
              if isinstance(value, dict):
                  return {key: remap(item) for key, item in value.items()}
              return value

          canonical_cove_path = ROOT / 'docs/project-chat-handoff.cove.json'
          candidate_path = ROOT / 'docs/handoff/pems/common-camera-reconciliation.candidate.pems.json'
          schema_path = ROOT / 'docs/handoff/pems/pems-v1.schema.json'

          canonical_cove_bytes = canonical_cove_path.read_bytes()
          base = normalize_document(decode(json.loads(canonical_cove_bytes), supported_profiles={'pems/1'}))
          assert len(base['records']) == BASE_COUNT
          assert serialize_cove(encode(base, profile='pems/1', serializer='jcs/1')) == canonical_cove_bytes
          base_records = {record['id']: copy.deepcopy(record) for record in base['records']}

          candidate = json.loads(candidate_path.read_text(encoding='utf-8'))
          candidate = normalize_document(candidate)
          assert len(candidate['records']) == FINAL_COUNT
          candidate_ids = {record['id'] for record in candidate['records']}
          assert set(MAPPINGS) <= candidate_ids

          admitted = normalize_document(remap(candidate))
          assert len(admitted['records']) == FINAL_COUNT
          admitted_records = {record['id']: record for record in admitted['records']}
          admitted_ids = set(admitted_records)
          assert set(MAPPINGS.values()) <= admitted_ids
          assert not (set(MAPPINGS) & admitted_ids)

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema_result = validate_schema(admitted, schema=schema)
          assert schema_result.valid, schema_result.diagnostics
          semantic_result = validate_semantics(admitted)
          assert semantic_result.valid, semantic_result.diagnostics

          base_ids = set(base_records)
          missing = sorted(base_ids - admitted_ids)
          rebound = sorted(
              record_id for record_id in base_ids
              if semantic_identity(base_records[record_id]) != semantic_identity(admitted_records[record_id])
          )
          assert not missing, missing
          assert not rebound, rebound
          assert len(base_ids) == BASE_COUNT

          assert admitted_records[DEMO_ID]['data']['path'] == 'demo/NoClipCameraController.gd'
          assert admitted_records[COMMON_ID]['data']['path'] == 'common/input/NoClipCameraController.gd'
          assert semantic_identity(admitted_records[DEMO_ID]) != semantic_identity(admitted_records[COMMON_ID])

          expanded_bytes = canonicalize(admitted)
          expanded_text = expanded_bytes.decode('utf-8')
          assert 'candidate:' not in expanded_text
          assert 'import:' not in expanded_text

          compact = encode(admitted, profile='pems/1', serializer='jcs/1')
          compact_bytes = serialize_cove(compact)
          human_bytes = render_human_markdown(admitted).encode('utf-8')

          assert serialize_cove(encode(admitted, profile='pems/1', serializer='jcs/1')) == compact_bytes
          assert canonicalize(admitted) == expanded_bytes
          assert render_human_markdown(admitted).encode('utf-8') == human_bytes
          assert normalize_document(decode(compact, supported_profiles={'pems/1'})) == admitted
          assert normalize_document(decode(parse_canonical(compact_bytes), supported_profiles={'pems/1'})) == admitted

          out = ROOT / 'docs/handoff/pems'
          pems_out = out / 'common-camera-reconciliation.admitted.pems.json'
          expanded_out = out / 'common-camera-reconciliation.admitted.expanded.json'
          cove_out = out / 'common-camera-reconciliation.admitted.cove.json'
          human_out = out / 'common-camera-reconciliation.admitted.md'
          evidence_out = out / 'common-camera-reconciliation.admitted.evidence.json'
          pems_out.write_bytes(expanded_bytes)
          expanded_out.write_bytes(expanded_bytes)
          cove_out.write_bytes(compact_bytes)
          human_out.write_bytes(human_bytes)

          sha256 = lambda data: hashlib.sha256(data).hexdigest()
          evidence = {
              'status': 'noncanonical_admitted_regeneration_ready_for_steward_canonical_review',
              'authorization': 'STEWARD-20260815-018',
              'acknowledges_architect_candidate': 'ARCH-20260815T030900-0700-023',
              'semantic': 'pems/1',
              'codec': 'cove/1',
              'serializer': 'jcs/1',
              'accepted_tooling_source': 'origin/post-cutover-admitted-regeneration',
              'canonical_authority_unchanged': 'docs/project-chat-handoff.cove.json',
              'base': {
                  'record_count': BASE_COUNT,
                  'cove_git_blob_sha': '093040e24ffe37c432e5bbad872344cbbc9f045b',
                  'cove_sha256': sha256(canonical_cove_bytes),
              },
              'record_count_after': len(admitted['records']),
              'steward_admission_map': MAPPINGS,
              'admitted_ids': sorted(MAPPINGS.values()),
              'existing_ids_preserved': len(base_ids),
              'missing_existing_ids': missing,
              'rebound_existing_ids': rebound,
              'remaining_provisional_ids': [],
              'identity_distinction': {
                  'demo_adapter_id': DEMO_ID,
                  'demo_adapter_path': admitted_records[DEMO_ID]['data']['path'],
                  'common_authoritative_id': COMMON_ID,
                  'common_authoritative_path': admitted_records[COMMON_ID]['data']['path'],
                  'semantic_rebinding': False,
              },
              'validation': {
                  'schema_valid': schema_result.valid,
                  'semantic_valid': semantic_result.valid,
                  'canonical_165_codec_control_byte_equal': True,
                  'all_165_existing_identities_preserved': True,
                  'all_six_admitted_ids_present': True,
                  'no_candidate_or_import_ids_remain': True,
                  'source_observation_provenance_valid': True,
                  'demo_common_identity_distinct': True,
                  'cove_round_trip': True,
                  'jcs_parse_decode_round_trip': True,
                  'repeated_canonical_bytes_identical': True,
                  'expanded_bytes_repeat_identical': True,
                  'human_reconstruction_deterministic': True,
              },
              'artifacts': {
                  str(pems_out): {'bytes': len(expanded_bytes), 'sha256': sha256(expanded_bytes)},
                  str(expanded_out): {'bytes': len(expanded_bytes), 'sha256': sha256(expanded_bytes)},
                  str(cove_out): {'bytes': len(compact_bytes), 'sha256': sha256(compact_bytes)},
                  str(human_out): {'bytes': len(human_bytes), 'sha256': sha256(human_bytes)},
              },
              'steward_action_required': 'Review admitted regeneration evidence and, if accepted, install exact admitted COVE and derivative canonically.',
              'owner_decision_required': False,
          }
          evidence_out.write_text(json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - name: Commit noncanonical admitted regeneration evidence
        run: |
          git config user.name 'Engineering Knowledge Systems Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/handoff/pems/common-camera-reconciliation.admitted.*
          git commit -m 'Generate admitted common camera continuity evidence'
          git push origin HEAD:pems-common-camera-reconciliation
