              '.github/workflows/architect-persistence-repair.yml',
          }
          assert set(paths) <= allowed, paths
          assert 'docs/project-chat-handoff.cove.json' not in paths
          assert 'docs/project-chat-handoff.json' not in paths
          assert 'docs/handoff/steward_notes.md' not in paths
          assert 'docs/handoff/steward_directive.md' not in paths
