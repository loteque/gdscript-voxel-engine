name: Architect Persistence Repair
on:
  push:
    branches: [project-chat-handoff]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify exact recovery mutation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,copy,itertools
          base=json.load(open('docs/project-chat-handoff.json'))
          target='090466c8a5683bb01c7038531f4cfdf59a2793a65fa344da13721ed294a7a6f7'
          old='Phase 8 technical cutover is complete and final Steward governance closeout is pending.'
          phrases=[
          'Phase 8 technical cutover and final Steward governance closeout are complete.',
          'Phase 8 technical cutover is complete and final Steward governance closeout is complete.',
          'Phase 8 technical cutover is complete and final Steward governance closeout is now complete.',
          'Phase 8 technical cutover is complete and final Steward governance closeout is accepted complete.',
          'Phase 8 technical cutover is complete and final Steward governance closeout is accepted/complete.',
          'Phase 8 technical cutover is complete and post-cutover governance closeout is complete.',
          'Phase 8 technical cutover and post-cutover governance closeout are complete.',
          'Phase 8 technical cutover is accepted complete and final Steward governance closeout is complete.',
          'Phase 8 technical cutover and final Steward governance closeout are accepted complete.',
          'Phase 8 technical cutover is complete; final Steward governance closeout is complete.',
          'Phase 8 technical cutover is complete. Final Steward governance closeout is complete.',
          'Phase 8 technical cutover is complete and Phase 8/post-cutover governance is fully closed.',
          'Phase 8 technical cutover is complete and post-cutover canonical reconciliation and governance closeout are complete.',
          'Phase 8 technical cutover and post-cutover canonical reconciliation/governance closeout are complete.',
          'Phase 8 technical cutover is complete and post-cutover canonical reconciliation/governance closeout is complete.'
          ]
          ids=('pems:decision:5fa3241c8b9bc2787b6d','pems:source_observation:15b32d4adb9bcfa4fc94')
          def canon(d): return json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def build(phrase,bits):
            chat_obs,cont_obs,hv,old_obs,dec_obs,project_obs,rationale,obs_current=bits
            d=copy.deepcopy(base); did,oid=ids
            for r in d['records']:
              if r['id']=='pems:decision:abe7b5d5efc6d7232e72':
                r['lifecycle']='superseded';r['superseded_by']=[did]
                if old_obs:r['observation_refs']=sorted(set(r['observation_refs']+[oid]))
              elif r['id']=='pems:chat:7da38ee068988502fe3b':
                r['data']['summary']=r['data']['summary'].replace(old,phrase)
                if chat_obs:r['observation_refs']=sorted(set(r['observation_refs']+[oid]))
              elif r['id']=='pems:continuation:7da38ee068988502fe3b':
                r['data']['current_focus']=r['data']['current_focus'].replace(old,phrase)
                if cont_obs:r['observation_refs']=sorted(set(r['observation_refs']+[oid]))
                if hv:r['data']['high_value_record_ids']=sorted(set(r['data']['high_value_record_ids']+[did]))
              elif r['id']=='pems:project:f16c91ec0a6e67eb2e1d' and project_obs:
                r['observation_refs']=sorted(set(r['observation_refs']+[oid]))
            data={'decision_state':'accepted','summary':'Engineering-memory representation workstream field \'phase8_status\' is "accepted_complete".'}
            if rationale:data['rationale']=None
            d['records'] += [
              {'data':data,'id':did,'kind':'decision','lifecycle':'current','observation_refs':([oid] if dec_obs else []),'supersedes':['pems:decision:abe7b5d5efc6d7232e72']},
              {'data':{'captured_fingerprint':'sha256:ef8951e67a7219bf829a5667f562f0f552360ce5c220cb5202b6eb84e806eaaa','evidence_locator':{'commit':'3ad4794f6ef89ecdde5077acee49c7d6844961f8','path':'docs/project-chat-handoff.cove.json','repository':'loteque/gdscript-voxel-engine'},'evidence_state':'immutable_snapshot','observed_at':'2026-08-14T10:03:17-07:00','source_id':'pems:source:eb92b21e7f3c92db6d23'},'id':oid,'kind':'source_observation','lifecycle':('current' if obs_current else 'historical'),'observation_refs':[]}
            ]
            d['records']=sorted(d['records'],key=lambda r:r['id'].encode())
            return d
          near=[]
          for phrase in phrases:
            for bits in itertools.product([False,True],repeat=8):
              d=build(phrase,bits); b=canon(d); h=hashlib.sha256(b).hexdigest()
              if h==target:
                print('EXACT',repr(phrase),bits,len(b));raise SystemExit(0)
              if len(b)==66860: near.append((h,phrase,bits))
          print('NO_EXACT; exact-size variants',len(near))
          for x in near[:100]:print(x)
          raise SystemExit(2)
          PY
