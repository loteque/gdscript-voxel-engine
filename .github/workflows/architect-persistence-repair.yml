Machine-readable persistence/validation evidence is `docs/handoff/pems/final-closeout-regeneration.persisted.evidence.json`.

### Validation evidence

Both variants contain 165 records and zero relations. Schema and semantic validation pass; all references resolve; reciprocal supersession is valid; historical records and all prior source observations are preserved; COVE decoding reproduces normalized PEMS exactly; repeated expanded `jcs/1`, compact `jcs/1`, and human reconstruction are byte-identical. Exact recovery hashes match, including contingent-admitted expanded SHA-256 `090466c8a5683bb01c7038531f4cfdf59a2793a65fa344da13721ed294a7a6f7`, COVE SHA-256 `a7ca5962c354161840822ce406bddd405296e4855afd2b0481f05f904291dc1a`, and human SHA-256 `f2a71b0606711de6f94fc0c598c43b4549e03708556ba9f94c3eacd991511e0c`.

The canonical Steward-owned files were re-hashed before this persistence write and remain the unchanged 163-record base: COVE blob `0ed7fd47dc5bf6a81078389cd9bc65e0864ad3be` / SHA-256 `ef8951e67a7219bf829a5667f562f0f552360ce5c220cb5202b6eb84e806eaaa`, and expanded derivative blob `10de73e29e0118b63a365dd47b566307c9a0b98b` / SHA-256 `bbbf623aa01608ce30680d4be55ba4f4cff275f5a46ae0ef2c724efb15845038`.

### Steward handoff

Verify the machine-readable evidence and the persisted Git blob identities above. If the two new identities are accepted, confirm the namespace-preserving admission map and install `docs/handoff/pems/final-closeout.contingent-admitted.cove.json` as canonical `docs/project-chat-handoff.cove.json` and the byte-identical expanded/PEMS artifact as `docs/project-chat-handoff.json`, then post-write verify the exact hashes and record governance closeout in Steward-owned history.

### Human reasoning

The original transport blocker was narrower than the repository's actual capabilities. Repository-native execution could generate large deterministic blobs in the working tree and commit them without manually retranscribing them through a size-limited connector. The first attempt correctly hard-stopped when an independently reconstructed semantic mutation failed the recovery hashes; the exact prior mutation was then recovered cryptographically and revalidated through the accepted implementation before persistence. This preserves the distinction between evidence and assertion while turning the previously computed-only state into independently fetchable Git evidence.
'''.encode('utf-8')
          notes_path.write_bytes(notes_after_recovery.rstrip(b'\n') + b'\n' + final_note)
          final_notes = notes_path.read_bytes()
          assert final_notes[:len(prior_notes)] == prior_notes
          assert final_notes.count(b'## ARCH-20260814T100300-0700-019') == 1
          assert final_notes.count(b'## ARCH-20260814T100300-0700-020') == 1
          assert final_notes.count(b'## ARCH-20260814T123200-0700-021') == 1

          # Final pre-commit authority guard: Architect must not mutate Steward canonical files.
          assert base_cove_path.read_bytes() == base_cove_bytes
          assert base_expanded_path.read_bytes() == base_expanded_bytes

          print(json.dumps({
              'candidate': {
                  'expanded': artifact_manifest['docs/handoff/pems/final-closeout.candidate.pems.json'],
                  'cove': artifact_manifest['docs/handoff/pems/final-closeout.candidate.cove.json'],
                  'human': artifact_manifest['docs/handoff/pems/final-closeout.candidate.md'],
              },
              'contingent_admitted': {
                  'expanded': artifact_manifest['docs/handoff/pems/final-closeout.contingent-admitted.pems.json'],
                  'cove': artifact_manifest['docs/handoff/pems/final-closeout.contingent-admitted.cove.json'],
                  'human': artifact_manifest['docs/handoff/pems/final-closeout.contingent-admitted.md'],
              },
              'notes_blob_before': 'cc835535407a39f6a69e3d1accb2ed5a0ba1360e',
              'notes_blob_after_expected': git_blob_sha(final_notes),
              'evidence_blob_expected': git_blob_sha(evidence_bytes),
          }, indent=2, sort_keys=True))
          PY

          # The transport workflow is one-shot infrastructure for this bounded repair and must not remain in the resulting tree.
          rm .github/workflows/architect-persistence-repair.yml

          # Explicitly stage only Architect-owned artifacts plus deletion of the temporary transport.
          git add docs/handoff/architect_notes.md \
            docs/handoff/pems/final-closeout.candidate.pems.json \
            docs/handoff/pems/final-closeout.candidate.expanded.json \
            docs/handoff/pems/final-closeout.candidate.cove.json \
            docs/handoff/pems/final-closeout.candidate.md \
            docs/handoff/pems/final-closeout.contingent-admitted.pems.json \
            docs/handoff/pems/final-closeout.contingent-admitted.expanded.json \
            docs/handoff/pems/final-closeout.contingent-admitted.cove.json \
            docs/handoff/pems/final-closeout.contingent-admitted.md \
            docs/handoff/pems/final-closeout-regeneration.persisted.evidence.json \
            .github/workflows/architect-persistence-repair.yml

          # Scope guard: no Steward-owned canonical artifacts, production files, ADRs, roadmap, demos, or tests may be staged.
          git diff --cached --name-only | tee /tmp/staged-files.txt
          python3 - <<'PY'
          from pathlib import Path
          paths = Path('/tmp/staged-files.txt').read_text().splitlines()
          allowed = {
              'docs/handoff/architect_notes.md',
              'docs/handoff/pems/final-closeout.candidate.pems.json',
              'docs/handoff/pems/final-closeout.candidate.expanded.json',
              'docs/handoff/pems/final-closeout.candidate.cove.json',
              'docs/handoff/pems/final-closeout.candidate.md',
              'docs/handoff/pems/final-closeout.contingent-admitted.pems.json',
              'docs/handoff/pems/final-closeout.contingent-admitted.expanded.json',
              'docs/handoff/pems/final-closeout.contingent-admitted.cove.json',
              'docs/handoff/pems/final-closeout.contingent-admitted.md',
