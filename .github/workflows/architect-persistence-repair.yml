name: Architect Persistence Repair
on:
  push:
    branches:
      - project-chat-handoff
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record verified hard-stop evidence
        run: python3 .github/scripts/architect_persistence_repair.py
      - name: Persist Architect hard-stop record and clean transport
        run: |
          rm .github/workflows/architect-persistence-repair.yml
          rm .github/scripts/architect_persistence_repair.py
          git add docs/handoff/architect_notes.md docs/handoff/pems/final-closeout-persistence-repair.hard-stop.json .github/workflows/architect-persistence-repair.yml .github/scripts/architect_persistence_repair.py
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep -E '^docs/project-chat-handoff(\.cove)?\.json$|^docs/handoff/steward_|^ROADMAP\.md$|^demo/|^tests/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record final closeout representation hard stop'
          git push origin HEAD:project-chat-handoff
