name: Architect Persistence Repair
on:
  push:
    branches: [project-chat-handoff]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate accepted PEMS COVE tooling
        shell: bash
        run: |
          set -euxo pipefail
          for ref in origin/cove-v1-codec origin/cove-deterministic-serialization origin/pems-validation-normalization origin/phase7-shadow-validation origin/pems-phase8-cutover origin/pems-postcutover-reconciliation origin/post-cutover-admitted-regeneration; do
            echo "===== $ref ====="
            git ls-tree -r --name-only "$ref" | grep -Ei '(pems|cove|jcs|canonical|human|shadow|handoff).*(\.py$|\.gd$|\.json$)' | head -200 || true
          done
          echo '===== likely python definitions ====='
          git grep -n -E 'def (encode|decode|normalize|canonical|human|render)|class .*Cove|jcs' origin/cove-v1-codec origin/cove-deterministic-serialization origin/pems-validation-normalization origin/phase7-shadow-validation origin/pems-phase8-cutover origin/pems-postcutover-reconciliation origin/post-cutover-admitted-regeneration -- '*.py' | head -500 || true
