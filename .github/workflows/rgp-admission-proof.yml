name: RGP Admission Proof

on:
  workflow_dispatch:
    inputs:
      submission_path:
        description: Immutable RGP submission path under docs/handoff/rgp/submissions/
        required: true
        type: string
      plan_path:
        description: Steward-authored admission transaction plan under docs/handoff/rgp/admission/transactions/
        required: true
        type: string
      base_path:
        description: Complete PEMS/2 base document
        required: true
        default: docs/project-chat-handoff.json
        type: string
      evidence_key:
        description: Safe artifact key
        required: true
        type: string
  workflow_call:
    inputs:
      submission_path:
        required: true
        type: string
      plan_path:
        required: true
        type: string
      base_path:
        required: false
        default: docs/project-chat-handoff.json
        type: string
      evidence_key:
        required: true
        type: string
  push:
    branches: [project-chat-handoff]
    paths:
      - '.github/workflows/rgp-admission-proof.yml'
      - 'docs/handoff/rgp/validator/**'
      - 'docs/handoff/rgp/admission/apply_admission_transaction.py'
      - 'docs/handoff/rgp/admission/apply_admission_transaction_v2.py'
      - 'docs/handoff/rgp/admission/test_admission_transaction_v2.py'
      - 'docs/handoff/pems/v2/validate_pems2_contract.py'

permissions:
  contents: read

jobs:
  self-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Replay RGP validator
        run: >-
          python3 docs/handoff/rgp/validator/rgp_validator.py
          docs/handoff/rgp/submissions/RGP-20260816T152100-0700-001.json

      - name: Validate current canonical PEMS2 as a candidate
        run: >-
          python3 docs/handoff/pems/v2/validate_pems2_contract.py
          --candidate docs/project-chat-handoff.json

      - name: Run guarded-update v2 pressure tests
        run: python3 docs/handoff/rgp/admission/test_admission_transaction_v2.py

      - name: Prove a deterministic no-op v1 admission transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.')
          tool_path = root / 'docs/handoff/rgp/admission/apply_admission_transaction.py'
          spec = importlib.util.spec_from_file_location('admission_tool', tool_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          base = json.loads((root / 'docs/project-chat-handoff.json').read_text(encoding='utf-8'))
          normalized = mod.normalize_pems(base)
          plan = {
              'contract': mod.CONTRACT,
              'expected_base_sha256': mod.sha256(mod.jcs(normalized)),
              'reuse_record_ids': [],
              'new_records': [],
              'new_relations': [],
          }
          Path('/tmp/noop-plan.json').write_text(json.dumps(plan), encoding='utf-8')
          PY
          python3 docs/handoff/rgp/admission/apply_admission_transaction.py \
            --base docs/project-chat-handoff.json \
            --plan /tmp/noop-plan.json \
            --schema docs/handoff/pems/v2/pems-v2.schema.json \
            --out-dir /tmp/rgp-admission-proof
          python3 docs/handoff/pems/v2/validate_pems2_contract.py \
            --candidate /tmp/rgp-admission-proof/candidate.pems2.jcs.json

  prove:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Run guarded-update v2 pressure tests
        run: python3 docs/handoff/rgp/admission/test_admission_transaction_v2.py

      - name: Validate runner inputs
        shell: bash
        env:
          SUBMISSION_PATH: ${{ inputs.submission_path }}
          PLAN_PATH: ${{ inputs.plan_path }}
          BASE_PATH: ${{ inputs.base_path }}
          EVIDENCE_KEY: ${{ inputs.evidence_key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          def safe_repo_path(value, prefix):
              p = PurePosixPath(value)
              if p.is_absolute() or '..' in p.parts or not value.startswith(prefix):
                  raise SystemExit(f'unsafe path: {value}')

          safe_repo_path(os.environ['SUBMISSION_PATH'], 'docs/handoff/rgp/submissions/')
          safe_repo_path(os.environ['PLAN_PATH'], 'docs/handoff/rgp/admission/transactions/')
          safe_repo_path(os.environ['BASE_PATH'], 'docs/')
          if not re.fullmatch(r'[A-Za-z0-9._-]+', os.environ['EVIDENCE_KEY']):
              raise SystemExit('evidence_key may contain only letters, digits, dot, underscore, and hyphen')
          PY

      - name: Replay authoritative RGP validator
        shell: bash
        env:
          SUBMISSION_PATH: ${{ inputs.submission_path }}
          EVIDENCE_KEY: ${{ inputs.evidence_key }}
        run: |
          set -euo pipefail
          mkdir -p "runner-output/${EVIDENCE_KEY}"
          python3 docs/handoff/rgp/validator/rgp_validator.py "$SUBMISSION_PATH" \
            | tee "runner-output/${EVIDENCE_KEY}/rgp-validator.txt"

      - name: Execute deterministic PEMS2 admission transaction
        shell: bash
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
          BASE_PATH: ${{ inputs.base_path }}
          EVIDENCE_KEY: ${{ inputs.evidence_key }}
        run: |
          set -euo pipefail
          CONTRACT="$(python3 - "$PLAN_PATH" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8')).get('contract', ''))
          PY
          )"
          case "$CONTRACT" in
            rgp-pems2-admission-transaction/1)
              TOOL=docs/handoff/rgp/admission/apply_admission_transaction.py
              ;;
            rgp-pems2-admission-transaction/2)
              TOOL=docs/handoff/rgp/admission/apply_admission_transaction_v2.py
              ;;
            *)
              echo "unsupported admission transaction contract: $CONTRACT" >&2
              exit 1
              ;;
          esac
          echo "contract=$CONTRACT tool=$TOOL"
          python3 "$TOOL" \
            --base "$BASE_PATH" \
            --plan "$PLAN_PATH" \
            --schema docs/handoff/pems/v2/pems-v2.schema.json \
            --out-dir "runner-output/${EVIDENCE_KEY}" \
            | tee "runner-output/${EVIDENCE_KEY}/transaction.txt"

      - name: Run candidate-aware PEMS2 contract validation
        shell: bash
        env:
          EVIDENCE_KEY: ${{ inputs.evidence_key }}
        run: |
          set -euo pipefail
          python3 docs/handoff/pems/v2/validate_pems2_contract.py \
            --candidate "runner-output/${EVIDENCE_KEY}/candidate.pems2.jcs.json" \
            | tee "runner-output/${EVIDENCE_KEY}/pems2-candidate-validation.txt"

      - name: Record immutable runner summary
        shell: bash
        env:
          SUBMISSION_PATH: ${{ inputs.submission_path }}
          PLAN_PATH: ${{ inputs.plan_path }}
          BASE_PATH: ${{ inputs.base_path }}
          EVIDENCE_KEY: ${{ inputs.evidence_key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          key = os.environ['EVIDENCE_KEY']
          out = Path('runner-output') / key
          names = [
              'candidate.pems2.jcs.json',
              'candidate.cove.json',
              'admission-proof.json',
              'rgp-validator.txt',
              'transaction.txt',
              'pems2-candidate-validation.txt',
          ]
          files = {}
          for name in names:
              data = (out / name).read_bytes()
              files[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          proof = json.loads((out / 'admission-proof.json').read_text(encoding='utf-8'))
          summary = {
              'status': 'passed',
              'runner': 'rgp-admission-proof/1',
              'admission_transaction_contract': proof['contract'],
              'submission_path': os.environ['SUBMISSION_PATH'],
              'plan_path': os.environ['PLAN_PATH'],
              'base_path': os.environ['BASE_PATH'],
              'evidence_key': key,
              'head_sha': os.environ.get('GITHUB_SHA'),
              'files': files,
              'canonical_written': False,
              'authority': 'proof_only',
          }
          (out / 'runner-summary.json').write_text(
              json.dumps(summary, sort_keys=True, separators=(',', ':')),
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload complete proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: rgp-admission-${{ inputs.evidence_key }}
          path: runner-output/${{ inputs.evidence_key }}/
          if-no-files-found: error
          retention-days: 30
