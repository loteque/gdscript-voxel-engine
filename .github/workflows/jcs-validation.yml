name: JCS Validation

on:
  push:
    branches:
      - cove-deterministic-serialization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-jcs:
    name: Validate PEMS COVE JCS conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PEMS dependencies
        run: python -m pip install -r tools/pems/requirements.txt
      - name: Install JCS dependency
        run: python -m pip install -r tools/cove/requirements.txt
      - name: Run PEMS semantic tests
        run: python -m unittest tests/test_pems_v1.py -v
      - name: Run COVE structural tests
        run: python -m unittest tests/test_cove_v1.py -v
      - name: Run JCS byte tests
        run: python -m unittest tests/test_jcs_v1.py -v
      - name: Run Phase 5 cross-layer conformance
        run: python -m unittest tests/test_pems_cove_conformance.py -v
