name: Architecture Governance Role Memory

on:
  push:
    branches: [architecture-governance-role-memory]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch accepted PEMS/COVE tooling ref
        run: git fetch origin pems-phase8-remediation

      - name: Install frozen tooling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema rfc8785

      - name: Generate and validate proposed canonical memory
        run: python .github/scripts/architecture_governance_role_memory.py

      - name: Commit deterministic canonical artifacts and evidence
        run: |
          if git diff --quiet -- docs/project-chat-handoff.cove.json docs/project-chat-handoff.json docs/handoff/pems/architecture-governance-role-memory.evidence.json; then
            echo "No canonical-memory diff produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-chat-handoff.cove.json docs/project-chat-handoff.json docs/handoff/pems/architecture-governance-role-memory.evidence.json
          git commit -m "Propose architecture governance mentor canonical memory"
          git push origin HEAD:architecture-governance-role-memory
