name: RGP Steward-Authorized Admission Executor

on:
  push:
    branches: [project-chat-handoff]
    paths:
      - 'docs/handoff/rgp/automation-requests/*.json'

permissions:
  contents: write

concurrency:
  group: rgp-admission-executor-project-chat-handoff
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact execution-request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout pinned Reasoning Distiller framework
        uses: actions/checkout@v4
        with:
          repository: loteque/reasoning-distiller
          ref: fb7290622d6a9d929a059f111cdd60cd50496fcf
          path: .reasoning-distiller
          fetch-depth: 1

      - name: Verify immutable framework pin
        run: test "$(git -C .reasoning-distiller rev-parse HEAD)" = "fb7290622d6a9d929a059f111cdd60cd50496fcf"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2

      - name: Validate project knowledge package against framework contract
        run: |
          python3 - <<'PY'
          import json, yaml
          from pathlib import Path
          from jsonschema import Draft202012Validator
          package=yaml.safe_load(Path('project-knowledge/project.yaml').read_text(encoding='utf-8'))
          schema=json.loads(Path('.reasoning-distiller/schemas/project-package.schema.json').read_text(encoding='utf-8'))
          errors=list(Draft202012Validator(schema).iter_errors(package))
          if errors:
              raise SystemExit('\n'.join(e.message for e in errors))
          backend=json.loads(Path(package['canonical_backend']['config']).read_text(encoding='utf-8'))
          assert backend['framework_pin'] == 'fb7290622d6a9d929a059f111cdd60cd50496fcf'
          print('PASS project-knowledge-package/1')
          PY

      - name: Resolve isolated Steward execution request
        id: request
        shell: bash
        env:
          EXPECTED_EXECUTION_ACTOR: loteque
        run: |
          set -euo pipefail
          mapfile -t CHANGES < <(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")
          if [ "${#CHANGES[@]}" -ne 1 ]; then
            echo "execution-request commit must contain exactly one changed path; found ${#CHANGES[@]}" >&2
            printf '%s\n' "${CHANGES[@]}" >&2
            exit 1
          fi
          STATUS="$(printf '%s\n' "${CHANGES[0]}" | awk '{print $1}')"
          REQUEST="$(printf '%s\n' "${CHANGES[0]}" | awk '{print $2}')"
          if [ "$STATUS" != "A" ] || [[ ! "$REQUEST" =~ ^docs/handoff/rgp/automation-requests/[^/]+\.json$ ]]; then
            echo "execution-request commit must add exactly one automation request JSON" >&2
            exit 1
          fi
          python3 - "$REQUEST" "$GITHUB_OUTPUT" "$GITHUB_ACTOR" "$EXPECTED_EXECUTION_ACTOR" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path, PurePosixPath

          path = Path(sys.argv[1])
          out = Path(sys.argv[2])
          actor = sys.argv[3]
          expected_execution_actor = sys.argv[4]
          req = json.loads(path.read_text(encoding='utf-8'))
          if req.get('contract') != 'rgp-steward-admission-execution-request/3':
              raise SystemExit('unsupported execution request contract')
          if actor != expected_execution_actor:
              raise SystemExit(f'execution actor mismatch: event={actor}')
          if req.get('execute') is not True:
              raise SystemExit('request must explicitly set execute=true')
          if req.get('reconciliation_authority') != 'project-engineering-steward':
              raise SystemExit('reconciliation authority must be project-engineering-steward')
          if not isinstance(req.get('install'), bool):
              raise SystemExit('install must be boolean')
          if not isinstance(req.get('reconciliation_digest'), str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', req['reconciliation_digest']):
              raise SystemExit('reconciliation_digest must be sha256:<64 lowercase hex>')

          required = ['submission_path','plan_path','base_path','evidence_key']
          for key in required:
              if not isinstance(req.get(key), str) or not req[key]:
                  raise SystemExit(f'missing/invalid {key}')

          def safe(value, prefix):
              p = PurePosixPath(value)
              if p.is_absolute() or '..' in p.parts or not value.startswith(prefix):
                  raise SystemExit(f'unsafe path: {value}')

          safe(req['submission_path'], 'docs/handoff/rgp/submissions/')
          safe(req['plan_path'], 'docs/handoff/rgp/admission/transactions/')
          safe(req['base_path'], 'docs/')
          if not re.fullmatch(r'[A-Za-z0-9._-]+', req['evidence_key']):
              raise SystemExit('invalid evidence_key')
          for key in ['submission_path','plan_path','base_path']:
              if not Path(req[key]).is_file():
                  raise SystemExit(f'referenced file does not exist: {req[key]}')

          actual_digest = 'sha256:' + hashlib.sha256(Path(req['plan_path']).read_bytes()).hexdigest()
          if actual_digest != req['reconciliation_digest']:
              raise SystemExit(f'Steward reconciliation digest mismatch: expected {req["reconciliation_digest"]} got {actual_digest}')

          values = {
              'request_path': path.as_posix(),
              'submission_path': req['submission_path'],
              'plan_path': req['plan_path'],
              'base_path': req['base_path'],
              'evidence_key': req['evidence_key'],
              'install': 'true' if req['install'] else 'false',
              'reconciliation_digest': req['reconciliation_digest'],
          }
          with out.open('a', encoding='utf-8') as f:
              for key, value in values.items():
                  f.write(f'{key}={value}\n')
          print(json.dumps(req, indent=2, sort_keys=True))
          PY

      - name: Replay authoritative RGP validator
        env:
          SUBMISSION_PATH: ${{ steps.request.outputs.submission_path }}
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "runner-output/$EVIDENCE_KEY"
          python3 .reasoning-distiller/validators/rgp_validator.py "$SUBMISSION_PATH" | tee "runner-output/$EVIDENCE_KEY/rgp-validator.txt"

      - name: Run guarded-update pressure tests
        run: python3 .reasoning-distiller/admission/test_admission_transaction_v2.py

      - name: Execute deterministic Steward reconciliation proof
        env:
          PLAN_PATH: ${{ steps.request.outputs.plan_path }}
          BASE_PATH: ${{ steps.request.outputs.base_path }}
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT="$(python3 - "$PLAN_PATH" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8')).get('contract',''))
          PY
          )"
          case "$CONTRACT" in
            rgp-pems2-admission-transaction/1) TOOL=.reasoning-distiller/admission/apply_admission_transaction.py ;;
            rgp-pems2-admission-transaction/2) TOOL=.reasoning-distiller/admission/apply_admission_transaction_v2.py ;;
            *) echo "unsupported admission transaction contract: $CONTRACT" >&2; exit 1 ;;
          esac
          python3 "$TOOL" --base "$BASE_PATH" --plan "$PLAN_PATH" --schema .reasoning-distiller/backends/pems-cove/pems-v2.schema.json --out-dir "runner-output/$EVIDENCE_KEY" | tee "runner-output/$EVIDENCE_KEY/transaction.txt"

      - name: Validate exact proof candidate
        env:
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .reasoning-distiller/backends/pems-cove/validate_pems2_contract.py --candidate "runner-output/$EVIDENCE_KEY/candidate.pems2.jcs.json" | tee "runner-output/$EVIDENCE_KEY/pems2-candidate-validation.txt"

      - name: Record deterministic execution summary
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          SUBMISSION_PATH: ${{ steps.request.outputs.submission_path }}
          PLAN_PATH: ${{ steps.request.outputs.plan_path }}
          BASE_PATH: ${{ steps.request.outputs.base_path }}
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
          INSTALL: ${{ steps.request.outputs.install }}
          RECONCILIATION_DIGEST: ${{ steps.request.outputs.reconciliation_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          key = os.environ['EVIDENCE_KEY']; out = Path('runner-output') / key
          files = {}
          for name in ['candidate.pems2.jcs.json','candidate.cove.json','admission-proof.json','rgp-validator.txt','transaction.txt','pems2-candidate-validation.txt']:
              data = (out / name).read_bytes(); files[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          summary = {
              'contract':'rgp-steward-admission-execution-evidence/3', 'status':'proof_passed',
              'execution_request_commit':os.environ['GITHUB_SHA'], 'request_path':os.environ['REQUEST_PATH'],
              'submission_path':os.environ['SUBMISSION_PATH'], 'plan_path':os.environ['PLAN_PATH'], 'base_path':os.environ['BASE_PATH'],
              'evidence_key':key, 'install_requested':os.environ['INSTALL'] == 'true',
              'reconciliation_authority':'project-engineering-steward', 'reconciliation_digest':os.environ['RECONCILIATION_DIGEST'],
              'framework_repository':'loteque/reasoning-distiller', 'framework_pin':'fb7290622d6a9d929a059f111cdd60cd50496fcf',
              'workflow_performs_semantic_reconciliation':False, 'canonical_written_during_proof':False, 'files':files,
          }
          (out / 'automation-summary.json').write_text(json.dumps(summary, sort_keys=True, separators=(',',':')), encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Persist exact proof evidence in a separate commit
        id: persist
        env:
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="docs/handoff/rgp/evidence/$EVIDENCE_KEY.runner-automation"
          test ! -e "$EVIDENCE_DIR"
          git fetch origin project-chat-handoff
          REMOTE="$(git rev-parse refs/remotes/origin/project-chat-handoff)"
          test "$REMOTE" = "$GITHUB_SHA" || { echo "branch moved before evidence persistence: $REMOTE" >&2; exit 1; }
          mkdir -p "$EVIDENCE_DIR"; cp "runner-output/$EVIDENCE_KEY/"* "$EVIDENCE_DIR/"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_DIR"; git commit -m "Persist Steward-authorized admission proof $EVIDENCE_KEY"
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"; git push origin HEAD:project-chat-handoff
          echo "evidence_dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"; echo "evidence_commit=$EVIDENCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install exact persisted candidate bytes
        if: steps.request.outputs.install == 'true'
        env:
          EVIDENCE_DIR: ${{ steps.persist.outputs.evidence_dir }}
          EVIDENCE_COMMIT: ${{ steps.persist.outputs.evidence_commit }}
          EVIDENCE_KEY: ${{ steps.request.outputs.evidence_key }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin project-chat-handoff
          REMOTE="$(git rev-parse refs/remotes/origin/project-chat-handoff)"
          test "$REMOTE" = "$EVIDENCE_COMMIT" || { echo "branch moved before canonical installation: $REMOTE" >&2; exit 1; }
          cmp -s "$EVIDENCE_DIR/candidate.pems2.jcs.json" docs/project-chat-handoff.json && { echo "requested install is a no-op" >&2; exit 1; }
          python3 .reasoning-distiller/backends/pems-cove/validate_pems2_contract.py --candidate "$EVIDENCE_DIR/candidate.pems2.jcs.json"
          cp "$EVIDENCE_DIR/candidate.pems2.jcs.json" docs/project-chat-handoff.json; cp "$EVIDENCE_DIR/candidate.cove.json" docs/project-chat-handoff.cove.json
          git add docs/project-chat-handoff.json docs/project-chat-handoff.cove.json
          git diff --cached --quiet && { echo "no canonical bytes changed" >&2; exit 1; }
          git commit -m "Install Steward-authorized RGP candidate $EVIDENCE_KEY"; INSTALL_COMMIT="$(git rev-parse HEAD)"; git push origin HEAD:project-chat-handoff
          test "$(git hash-object docs/project-chat-handoff.json)" = "$(git hash-object "$EVIDENCE_DIR/candidate.pems2.jcs.json")"
          test "$(git hash-object docs/project-chat-handoff.cove.json)" = "$(git hash-object "$EVIDENCE_DIR/candidate.cove.json")"
          echo "installed exact candidate at $INSTALL_COMMIT"
