name: PEMS2 Full Corpus Evidence

on:
  push:
    branches:
      - project-chat-handoff
    paths:
      - 'docs/handoff/pems/v2/generate_full_corpus_evidence.py'
      - '.github/workflows/pems2-full-corpus-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate successor contract
        run: python docs/handoff/pems/v2/validate_pems2_contract.py

      - name: Generate full-corpus evidence twice
        run: |
          python docs/handoff/pems/v2/generate_full_corpus_evidence.py | tee /tmp/pems2-run1.txt
          sha256sum docs/handoff/pems/v2/FULL_CORPUS_PEMS2.json docs/handoff/pems/v2/FULL_CORPUS_MIGRATION_EVIDENCE.json docs/handoff/pems/v2/FULL_CORPUS_HUMAN_RECONSTRUCTION.md > /tmp/hashes1.txt
          python docs/handoff/pems/v2/generate_full_corpus_evidence.py | tee /tmp/pems2-run2.txt
          sha256sum docs/handoff/pems/v2/FULL_CORPUS_PEMS2.json docs/handoff/pems/v2/FULL_CORPUS_MIGRATION_EVIDENCE.json docs/handoff/pems/v2/FULL_CORPUS_HUMAN_RECONSTRUCTION.md > /tmp/hashes2.txt
          diff -u /tmp/hashes1.txt /tmp/hashes2.txt
          cat /tmp/hashes2.txt

      - name: Commit evidence artifacts
        run: |
          if git diff --quiet -- docs/handoff/pems/v2/FULL_CORPUS_PEMS2.json docs/handoff/pems/v2/FULL_CORPUS_MIGRATION_EVIDENCE.json docs/handoff/pems/v2/FULL_CORPUS_HUMAN_RECONSTRUCTION.md && \
             git ls-files --error-unmatch docs/handoff/pems/v2/FULL_CORPUS_PEMS2.json >/dev/null 2>&1; then
            echo 'Evidence artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/pems/v2/FULL_CORPUS_PEMS2.json \
                  docs/handoff/pems/v2/FULL_CORPUS_MIGRATION_EVIDENCE.json \
                  docs/handoff/pems/v2/FULL_CORPUS_HUMAN_RECONSTRUCTION.md
          git commit -m 'pems2: record full-corpus migration evidence'
          git push origin HEAD:project-chat-handoff
