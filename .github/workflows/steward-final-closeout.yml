name: Steward Final Closeout Append

on:
  push:
    branches: [project-chat-handoff]
    paths:
      - .github/workflows/steward-final-closeout.yml

permissions:
  contents: write

jobs:
  append-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          fetch-depth: 0
      - name: Verify immutable inputs and append final Steward record
        shell: bash
        env:
          CLOSEOUT_B64: 
        run: |
          set -euo pipefail
          expected_notes_blob="be41aa3fbb20a9d61443e18ac9de74b7f3905d13"
          test "$(git hash-object docs/handoff/steward_notes.md)" = "$expected_notes_blob"
          test "$(git hash-object docs/project-chat-handoff.cove.json)" = "093040e24ffe37c432e5bbad872344cbbc9f045b"
          test "$(git hash-object docs/project-chat-handoff.json)" = "14cc12dd8f0b9c6bdc7c5776780c6d7fdcf9b5e1"
          grep -q '"record_count_after": 165' docs/handoff/pems/final-closeout-corrected-frozen-codec.evidence.json
          grep -q '"canonical_163_codec_control_byte_equal": true' docs/handoff/pems/final-closeout-corrected-frozen-codec.evidence.json
          grep -q '"cove_round_trip": true' docs/handoff/pems/final-closeout-corrected-frozen-codec.evidence.json
          grep -q '"schema_valid": true' docs/handoff/pems/final-closeout-corrected-frozen-codec.evidence.json
          grep -q '"semantic_valid": true' docs/handoff/pems/final-closeout-corrected-frozen-codec.evidence.json
          if grep -q '^## STEWARD-20260814-016$' docs/handoff/steward_notes.md; then
            echo 'Closeout record already present; refusing duplicate append.' >&2
            exit 1
          fi
          printf '%s' "$CLOSEOUT_B64" | base64 --decode >> docs/handoff/steward_notes.md
          test "$(head -c 46897 docs/handoff/steward_notes.md | git hash-object --stdin)" = "$expected_notes_blob"
          rm .github/workflows/steward-final-closeout.yml
          git config user.name "Project Engineering Steward"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/handoff/steward_notes.md .github/workflows/steward-final-closeout.yml
          git commit -m "Record final Phase 8 governance closeout"
          git push origin HEAD:project-chat-handoff
