name: Append Architect common camera handoff

on:
  push:
    branches:
      - pems-common-camera-reconciliation
    paths:
      - .github/workflows/append-architect-common-camera-handoff.yml

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Architect-owned handoff safely
        env:
          NOTE_B64: 
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Architect-owned handoff safely
        run: |
          git fetch origin project-chat-handoff
          git checkout -B architect-handoff-write origin/project-chat-handoff
          test "$(git hash-object docs/handoff/architect_notes.md)" = "f106de8249148f685a9a9a0b3ed75adf84add1cb"
          grep -q 'STEWARD-20260815-017' docs/handoff/steward_notes.md
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('docs/handoff/architect_notes.md')
          original = path.read_bytes()
          note = base64.b64decode(os.environ['NOTE_B64'])
          if b'ARCH-20260815T030900-0700-023' in original:
              raise SystemExit('note already exists')
          path.write_bytes(original + note)
          assert path.read_bytes().startswith(original)
          PY
          git diff --check
          git config user.name 'Engineering Knowledge Systems Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/handoff/architect_notes.md
          git commit -m 'Record common camera reconciliation candidate handoff'
          git push origin HEAD:project-chat-handoff
