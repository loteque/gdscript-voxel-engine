name: Append Architect common camera handoff

on:
  push:
    branches:
      - pems-common-camera-reconciliation
    paths:
      - .github/workflows/append-architect-common-camera-handoff.yml

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Architect-owned handoff safely
        run: |
          git fetch origin project-chat-handoff pems-common-camera-reconciliation
          git checkout -B architect-handoff-write origin/project-chat-handoff
          test "$(git hash-object docs/handoff/architect_notes.md)" = "f106de8249148f685a9a9a0b3ed75adf84add1cb"
          grep -q 'STEWARD-20260815-017' docs/handoff/steward_notes.md
          test -z "$(grep -F 'ARCH-20260815T030900-0700-023' docs/handoff/architect_notes.md || true)"
          git show origin/pems-common-camera-reconciliation:docs/handoff/pems/architect-note-20260815T030900-0700-023.md >> docs/handoff/architect_notes.md
          git diff --check
          git config user.name 'Engineering Knowledge Systems Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/handoff/architect_notes.md
          git commit -m 'Record common camera reconciliation candidate handoff'
          git push origin HEAD:project-chat-handoff
