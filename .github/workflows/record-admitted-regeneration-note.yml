          test "$(git rev-parse HEAD)" = "8fb8493ac4dba7f5786e02b3ade07c35817285e3"
          test -f docs/handoff/pems/postcutover-reconciliation.admitted.evidence.json
          test -f docs/handoff/architect_notes.md
