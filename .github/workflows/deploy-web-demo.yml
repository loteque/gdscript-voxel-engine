name: Deploy Versioned Web Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    name: Export and archive web demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Export terrain demo
        shell: bash
        run: |
          mkdir -p build/web/terrain
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/terrain/index.html

      - name: Export chunk validation demo
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot "$RUNNER_TEMP/project.godot.original"
          trap 'cp "$RUNNER_TEMP/project.godot.original" project.godot' EXIT

          python - <<'PY'
          from pathlib import Path

          project_path = Path('project.godot')
          text = project_path.read_text(encoding='utf-8')
          prefix = 'run/main_scene='
          lines = text.splitlines()
          replaced = False

          for index, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[index] = 'run/main_scene="res://demo/ChunkValidationDemo.tscn"'
                  replaced = True
                  break

          if not replaced:
              raise SystemExit('project.godot does not define run/main_scene.')

          project_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          mkdir -p build/web/chunks
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/chunks/index.html

      - name: Add grouped demo selectors
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python .github/scripts/inject_demo_selector.py \
            build/web/terrain/index.html \
            "$CURRENT_VERSION" \
            terrain \
            "Terrain / Surface Nets Demo" \
            ../versions.json

          python .github/scripts/inject_demo_selector.py \
            build/web/chunks/index.html \
            "$CURRENT_VERSION" \
            chunks \
            "Chunk Validation Demo" \
            ../../versions.json

      - name: Preserve exported builds
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/web-build/terrain"
          mkdir -p "$RUNNER_TEMP/web-build/chunks"
          cp -a build/web/terrain/. "$RUNNER_TEMP/web-build/terrain/"
          cp -a build/web/chunks/. "$RUNNER_TEMP/web-build/chunks/"

      - name: Prepare version archive worktree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="$RUNNER_TEMP/pages-archive"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/heads/gh-pages
            git worktree add "$ARCHIVE" gh-pages
          else
            git worktree add -b gh-pages "$ARCHIVE"
            git -C "$ARCHIVE" rm -rf .
          fi

          if [ -e "$ARCHIVE/$VERSION" ]; then
            echo "Version $VERSION is already published. Published versions are immutable."
            exit 1
          fi

          # Remove legacy root build output accidentally committed by earlier deployments.
          rm -rf "$ARCHIVE/build"

          # Preserve the historical version-root URL as the primary terrain demo.
          mkdir -p "$ARCHIVE/$VERSION"
          cp -a "$RUNNER_TEMP/web-build/terrain/." "$ARCHIVE/$VERSION/"

          # Additional demos live below the same immutable version directory.
          mkdir -p "$ARCHIVE/$VERSION/chunks"
          cp -a "$RUNNER_TEMP/web-build/chunks/." "$ARCHIVE/$VERSION/chunks/"
          touch "$ARCHIVE/.nojekyll"

          cat > "$ARCHIVE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./$VERSION/">
            <link rel="canonical" href="./$VERSION/">
            <title>GDScript Voxel Terrain $VERSION</title>
          </head>
          <body>
            <p>Opening <a href="./$VERSION/">GDScript Voxel Terrain $VERSION</a>…</p>
          </body>
          </html>
          EOF

          python .github/scripts/build_demo_manifest.py "$ARCHIVE"

          git -C "$ARCHIVE" config user.name "github-actions[bot]"
          git -C "$ARCHIVE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ARCHIVE" add -A
          git -C "$ARCHIVE" commit -m "Publish web demos $VERSION"
          git -C "$ARCHIVE" push origin gh-pages

      - name: Package Pages site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git -C "$RUNNER_TEMP/pages-archive" archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
