name: Deploy Versioned Web Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    name: Export and archive web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/index.html
          touch build/web/.nojekyll

      - name: Add version selector
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          index_path = Path('build/web/index.html')
          html = index_path.read_text(encoding='utf-8')
          current_version = os.environ['CURRENT_VERSION']

          selector = f'''
          <style id="voxel-version-selector-style">
            #voxel-version-selector {{
              position: fixed;
              top: 12px;
              right: 12px;
              z-index: 2147483647;
              padding: 6px 8px;
              border: 1px solid rgba(255, 255, 255, 0.22);
              border-radius: 6px;
              background: rgba(7, 21, 34, 0.86);
              color: #f3f5f7;
              font: 12px/1.2 monospace;
              backdrop-filter: blur(4px);
            }}
          </style>
          <select id="voxel-version-selector" aria-label="Select demo version">
            <option value="{current_version}" selected>v{current_version}</option>
          </select>
          <script>
            (() => {{
              const currentVersion = {current_version!r};
              const selector = document.getElementById('voxel-version-selector');

              fetch('../versions.json', {{ cache: 'no-store' }})
                .then(response => {{
                  if (!response.ok) throw new Error('HTTP ' + response.status);
                  return response.json();
                }})
                .then(data => {{
                  const versions = Array.isArray(data.versions) ? data.versions : [];
                  selector.replaceChildren();

                  for (const version of versions) {{
                    const option = document.createElement('option');
                    option.value = version;
                    option.textContent = 'v' + version;
                    option.selected = version === currentVersion;
                    selector.appendChild(option);
                  }}
                }})
                .catch(error => console.warn('Unable to load demo versions:', error));

              selector.addEventListener('change', () => {{
                if (selector.value === currentVersion) return;
                window.location.href = '../' + selector.value + '/';
              }});
            }})();
          </script>
          '''

          if '</body>' not in html:
              raise SystemExit('Exported index.html does not contain </body>.')

          html = html.replace('</body>', selector + '\n</body>', 1)
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Preserve exported build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/web-build"
          cp -a build/web/. "$RUNNER_TEMP/web-build/"

      - name: Prepare version archive worktree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="$RUNNER_TEMP/pages-archive"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/heads/gh-pages
            git worktree add "$ARCHIVE" gh-pages
          else
            git worktree add -b gh-pages "$ARCHIVE"
            git -C "$ARCHIVE" rm -rf .
          fi

          if [ -e "$ARCHIVE/$VERSION" ]; then
            echo "Version $VERSION is already published. Published versions are immutable."
            exit 1
          fi

          # Remove legacy root build output accidentally committed by earlier deployments.
          rm -rf "$ARCHIVE/build"

          mkdir -p "$ARCHIVE/$VERSION"
          cp -a "$RUNNER_TEMP/web-build/." "$ARCHIVE/$VERSION/"
          touch "$ARCHIVE/.nojekyll"

          cat > "$ARCHIVE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./$VERSION/">
            <link rel="canonical" href="./$VERSION/">
            <title>GDScript Voxel Terrain $VERSION</title>
          </head>
          <body>
            <p>Opening <a href="./$VERSION/">GDScript Voxel Terrain $VERSION</a>…</p>
          </body>
          </html>
          EOF

          python - "$ARCHIVE" <<'PY'
          import json
          import os
          import re
          import sys

          archive = sys.argv[1]
          pattern = re.compile(r"^\d+\.\d+\.\d+$")
          versions = [
              name for name in os.listdir(archive)
              if os.path.isdir(os.path.join(archive, name)) and pattern.fullmatch(name)
          ]
          versions.sort(key=lambda value: tuple(map(int, value.split('.'))), reverse=True)
          with open(os.path.join(archive, 'versions.json'), 'w', encoding='utf-8') as handle:
              json.dump({'latest': versions[0], 'versions': versions}, handle, indent=2)
              handle.write('\n')
          PY

          git -C "$ARCHIVE" config user.name "github-actions[bot]"
          git -C "$ARCHIVE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ARCHIVE" add -A
          git -C "$ARCHIVE" commit -m "Publish web demo $VERSION"
          git -C "$ARCHIVE" push origin gh-pages

      - name: Package Pages site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git -C "$RUNNER_TEMP/pages-archive" archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
