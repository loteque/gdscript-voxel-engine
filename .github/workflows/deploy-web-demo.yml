name: Deploy Versioned Web Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    name: Export and archive web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/index.html
          touch build/web/.nojekyll

      - name: Preserve exported build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/web-build"
          cp -a build/web/. "$RUNNER_TEMP/web-build/"

      - name: Prepare version archive branch
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git switch gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf .
          fi

          if [ -e "$VERSION" ]; then
            echo "Version $VERSION is already published. Published versions are immutable."
            exit 1
          fi

          mkdir -p "$VERSION"
          cp -a "$RUNNER_TEMP/web-build/." "$VERSION/"
          touch .nojekyll

          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./$VERSION/">
            <link rel="canonical" href="./$VERSION/">
            <title>GDScript Voxel Terrain $VERSION</title>
          </head>
          <body>
            <p>Opening <a href="./$VERSION/">GDScript Voxel Terrain $VERSION</a>…</p>
          </body>
          </html>
          EOF

          python - <<'PY'
          import json
          import os
          import re

          pattern = re.compile(r"^\d+\.\d+\.\d+$")
          versions = [name for name in os.listdir('.') if os.path.isdir(name) and pattern.fullmatch(name)]
          versions.sort(key=lambda value: tuple(map(int, value.split('.'))), reverse=True)
          with open('versions.json', 'w', encoding='utf-8') as handle:
              json.dump({'latest': versions[0], 'versions': versions}, handle, indent=2)
              handle.write('\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish web demo $VERSION"
          git push origin gh-pages

      - name: Package Pages site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
