name: Deploy Versioned Web Demo

on:
  push:
    branches:
      - main
      - nf/integration
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    name: Export and archive web demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve publication channel
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
            echo "release_id=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release_label=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "archive_path=$VERSION" >> "$GITHUB_OUTPUT"
            echo "terrain_manifest_url=../versions.json" >> "$GITHUB_OUTPUT"
            echo "chunks_manifest_url=../../versions.json" >> "$GITHUB_OUTPUT"
            echo "streaming_manifest_url=../../versions.json" >> "$GITHUB_OUTPUT"
            echo "publication_type=release" >> "$GITHUB_OUTPUT"
            echo "Publishing immutable release $VERSION"
          elif [ "$GITHUB_REF_NAME" = "nf/integration" ]; then
            echo "release_id=integration" >> "$GITHUB_OUTPUT"
            echo "release_label=Integration Preview" >> "$GITHUB_OUTPUT"
            echo "archive_path=preview/integration" >> "$GITHUB_OUTPUT"
            echo "terrain_manifest_url=../../versions.json" >> "$GITHUB_OUTPUT"
            echo "chunks_manifest_url=../../../versions.json" >> "$GITHUB_OUTPUT"
            echo "streaming_manifest_url=../../../versions.json" >> "$GITHUB_OUTPUT"
            echo "publication_type=preview" >> "$GITHUB_OUTPUT"
            echo "Publishing mutable integration preview"
          else
            echo "Unsupported publication branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Export terrain demo
        shell: bash
        run: |
          mkdir -p build/web/terrain
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/terrain/index.html

      - name: Export chunk validation demo
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot "$RUNNER_TEMP/project.godot.original"
          trap 'cp "$RUNNER_TEMP/project.godot.original" project.godot' EXIT

          python - <<'PY'
          from pathlib import Path

          project_path = Path('project.godot')
          text = project_path.read_text(encoding='utf-8')
          prefix = 'run/main_scene='
          lines = text.splitlines()
          replaced = False

          for index, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[index] = 'run/main_scene="res://demo/ChunkValidationDemo.tscn"'
                  replaced = True
                  break

          if not replaced:
              raise SystemExit('project.godot does not define run/main_scene.')

          project_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          mkdir -p build/web/chunks
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/chunks/index.html

      - name: Export chunk streaming demo
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot "$RUNNER_TEMP/project.godot.original"
          trap 'cp "$RUNNER_TEMP/project.godot.original" project.godot' EXIT

          python - <<'PY'
          from pathlib import Path

          project_path = Path('project.godot')
          text = project_path.read_text(encoding='utf-8')
          prefix = 'run/main_scene='
          lines = text.splitlines()
          replaced = False

          for index, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[index] = 'run/main_scene="res://demo/ChunkStreamingValidationDemo.tscn"'
                  replaced = True
                  break

          if not replaced:
              raise SystemExit('project.godot does not define run/main_scene.')

          project_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          mkdir -p build/web/streaming
          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/streaming/index.html

      - name: Add grouped demo selectors
        shell: bash
        env:
          CURRENT_RELEASE_ID: ${{ steps.publication.outputs.release_id }}
          CURRENT_RELEASE_LABEL: ${{ steps.publication.outputs.release_label }}
          TERRAIN_MANIFEST_URL: ${{ steps.publication.outputs.terrain_manifest_url }}
          CHUNKS_MANIFEST_URL: ${{ steps.publication.outputs.chunks_manifest_url }}
          STREAMING_MANIFEST_URL: ${{ steps.publication.outputs.streaming_manifest_url }}
        run: |
          python .github/scripts/inject_demo_selector.py \
            build/web/terrain/index.html \
            "$CURRENT_RELEASE_ID" \
            "$CURRENT_RELEASE_LABEL" \
            terrain \
            "Terrain / Surface Nets Demo" \
            "$TERRAIN_MANIFEST_URL"

          python .github/scripts/inject_demo_selector.py \
            build/web/chunks/index.html \
            "$CURRENT_RELEASE_ID" \
            "$CURRENT_RELEASE_LABEL" \
            chunks \
            "Chunk Validation Demo" \
            "$CHUNKS_MANIFEST_URL"

          python .github/scripts/inject_demo_selector.py \
            build/web/streaming/index.html \
            "$CURRENT_RELEASE_ID" \
            "$CURRENT_RELEASE_LABEL" \
            streaming \
            "Chunk Streaming Demo" \
            "$STREAMING_MANIFEST_URL"

      - name: Preserve exported builds
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/web-build/terrain"
          mkdir -p "$RUNNER_TEMP/web-build/chunks"
          mkdir -p "$RUNNER_TEMP/web-build/streaming"
          cp -a build/web/terrain/. "$RUNNER_TEMP/web-build/terrain/"
          cp -a build/web/chunks/. "$RUNNER_TEMP/web-build/chunks/"
          cp -a build/web/streaming/. "$RUNNER_TEMP/web-build/streaming/"

      - name: Prepare Pages archive worktree
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.publication.outputs.archive_path }}
          PUBLICATION_TYPE: ${{ steps.publication.outputs.publication_type }}
          RELEASE_ID: ${{ steps.publication.outputs.release_id }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/pages-archive"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/heads/gh-pages
            git worktree add "$ARCHIVE" gh-pages
          else
            git worktree add -b gh-pages "$ARCHIVE"
            git -C "$ARCHIVE" rm -rf .
          fi

          # Remove legacy root build output accidentally committed by earlier deployments.
          rm -rf "$ARCHIVE/build"

          if [ "$PUBLICATION_TYPE" = "release" ]; then
            if [ -e "$ARCHIVE/$ARCHIVE_PATH" ]; then
              echo "Version $RELEASE_ID is already published. Published versions are immutable."
              exit 1
            fi

            # Preserve the historical version-root URL as the primary terrain demo.
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH"
            cp -a "$RUNNER_TEMP/web-build/terrain/." "$ARCHIVE/$ARCHIVE_PATH/"

            # Additional demos live below the same immutable version directory.
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH/chunks"
            cp -a "$RUNNER_TEMP/web-build/chunks/." "$ARCHIVE/$ARCHIVE_PATH/chunks/"
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH/streaming"
            cp -a "$RUNNER_TEMP/web-build/streaming/." "$ARCHIVE/$ARCHIVE_PATH/streaming/"

            cat > "$ARCHIVE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./$RELEASE_ID/">
            <link rel="canonical" href="./$RELEASE_ID/">
            <title>GDScript Voxel Terrain $RELEASE_ID</title>
          </head>
          <body>
            <p>Opening <a href="./$RELEASE_ID/">GDScript Voxel Terrain $RELEASE_ID</a>…</p>
          </body>
          </html>
          EOF
          else
            # The integration preview is intentionally mutable: each successful
            # integration build replaces the previous preview without touching releases.
            rm -rf "$ARCHIVE/$ARCHIVE_PATH"
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH"
            cp -a "$RUNNER_TEMP/web-build/terrain/." "$ARCHIVE/$ARCHIVE_PATH/"
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH/chunks"
            cp -a "$RUNNER_TEMP/web-build/chunks/." "$ARCHIVE/$ARCHIVE_PATH/chunks/"
            mkdir -p "$ARCHIVE/$ARCHIVE_PATH/streaming"
            cp -a "$RUNNER_TEMP/web-build/streaming/." "$ARCHIVE/$ARCHIVE_PATH/streaming/"
          fi

          touch "$ARCHIVE/.nojekyll"
          python .github/scripts/build_demo_manifest.py "$ARCHIVE"

          git -C "$ARCHIVE" config user.name "github-actions[bot]"
          git -C "$ARCHIVE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ARCHIVE" add -A

          if git -C "$ARCHIVE" diff --cached --quiet; then
            echo "Pages archive already matches this publication."
          else
            if [ "$PUBLICATION_TYPE" = "release" ]; then
              git -C "$ARCHIVE" commit -m "Publish web demos $RELEASE_ID"
            else
              git -C "$ARCHIVE" commit -m "Publish integration web preview"
            fi
            git -C "$ARCHIVE" push origin gh-pages
          fi

      - name: Package Pages site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git -C "$RUNNER_TEMP/pages-archive" archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
