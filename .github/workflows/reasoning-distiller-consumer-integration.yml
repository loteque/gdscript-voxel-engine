name: Reasoning Distiller Consumer Integration

on:
  push:
    branches: [project-chat-handoff]
    paths:
      - '.reasoning-distiller/**'
      - 'project-knowledge/**'
      - '.github/workflows/reasoning-distiller-consumer-integration.yml'
      - '.github/workflows/rgp-steward-admission-automation.yml'
  pull_request:
    branches: [project-chat-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout voxel-engine project
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2

      - name: Verify project-local package identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.reasoning-distiller')
          manifest=json.loads((root/'.installation/MANIFEST.json').read_text(encoding='utf-8'))
          installation=json.loads((root/'.installation/INSTALLATION.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.1'
          assert manifest['source_commit'] == '1da88edc000bbd6db78affe8e604ca499f516d55'
          assert manifest['content_identity'] == 'sha256:a487149caaaf41af70fdf2af6e52b7955a6c3fe14046321649357d21ba7241b4'
          assert installation['content_identity'] == manifest['content_identity']
          assert installation['managed_root'] == '.reasoning-distiller'
          print('PASS local Reasoning Distiller package identity')
          PY

      - name: Validate Project Knowledge Package and local backend binding
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          from jsonschema import Draft202012Validator
          package=yaml.safe_load(Path('project-knowledge/project.yaml').read_text(encoding='utf-8'))
          schema=json.loads(Path('.reasoning-distiller/schemas/project-package.schema.json').read_text(encoding='utf-8'))
          errors=list(Draft202012Validator(schema).iter_errors(package))
          if errors:
              raise SystemExit('\n'.join(e.message for e in errors))
          required={'reasoning-distiller-install-package/1','reasoning-distiller-installer/1'}
          assert required.issubset(set(package['framework']['compatible_contracts']))
          backend=json.loads(Path(package['canonical_backend']['config']).read_text(encoding='utf-8'))
          assert backend['framework_installation'] == '.reasoning-distiller/.installation/INSTALLATION.json'
          assert backend['framework_version'] == '0.1.1'
          assert backend['framework_source_commit'] == '1da88edc000bbd6db78affe8e604ca499f516d55'
          assert backend['framework_content_identity'] == 'sha256:a487149caaaf41af70fdf2af6e52b7955a6c3fe14046321649357d21ba7241b4'
          assert Path(backend['pems_path']).is_file()
          assert Path(backend['cove_path']).is_file()
          for key in ('sources','rules','roles','authority','adapters','policy'):
              assert Path(package['locations'][key]).is_dir(), f'missing package location: {key}'
          print('PASS project-knowledge-package/1 local binding')
          PY

      - name: Block Python network for runtime proof
        run: |
          mkdir -p /tmp/rd-netblock
          cat > /tmp/rd-netblock/sitecustomize.py <<'PY'
          import socket
          def blocked(*args, **kwargs):
              raise RuntimeError('network disabled during consumer proof')
          socket.create_connection = blocked
          socket.getaddrinfo = blocked
          socket.socket.connect = blocked
          PY
          echo "PYTHONPATH=/tmp/rd-netblock" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Validate active canonical PEMS through local framework
        run: python .reasoning-distiller/backends/pems-cove/validate_pems2_contract.py --candidate docs/project-chat-handoff.json

      - name: Validate project RGP submission through local framework
        run: python .reasoning-distiller/validators/rgp_validator.py docs/handoff/rgp/submissions/RGP-20260817T101500-0700-009.json

      - name: Run local guarded-admission pressure suite
        run: python .reasoning-distiller/admission/test_admission_transaction_v2.py

      - name: Verify embedded generic implementation is retired
        run: |
          python - <<'PY'
          from pathlib import Path
          retired=(
              'docs/handoff/rgp/validator/rgp_validator.py',
              'docs/handoff/rgp/admission/apply_admission_transaction.py',
              'docs/handoff/rgp/admission/apply_admission_transaction_v2.py',
              'docs/handoff/rgp/admission/test_admission_transaction_v2.py',
              'docs/handoff/pems/v2/pems-v2.schema.json',
              'docs/handoff/pems/v2/validate_pems2_contract.py',
              'docs/handoff/pems/v2/validate_rgp_uncertainty_import.py',
              'docs/distiller/validation/run_fixture_tests.py',
              'docs/distiller/validation/schema.json',
              'docs/distiller/validation/validate_distillation.py',
          )
          present=[p for p in retired if Path(p).exists()]
          assert not present, f'embedded generic implementation remains: {present}'
          print('PASS embedded generic implementation retired')
          PY

      - name: Verify project-owned authority boundary
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          package=yaml.safe_load(Path('project-knowledge/project.yaml').read_text(encoding='utf-8'))
          for key in ('authority','rules','roles','policy'):
              assert package['locations'][key].startswith('project-knowledge/')
          backend=json.loads(Path('project-knowledge/canonical/backend.json').read_text(encoding='utf-8'))
          assert backend['pems_path'] == 'docs/project-chat-handoff.json'
          assert backend['cove_path'] == 'docs/project-chat-handoff.cove.json'
          print('PASS project owns authority, rules, roles, policy, and canonical state')
          PY
