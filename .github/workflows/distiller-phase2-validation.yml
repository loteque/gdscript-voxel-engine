name: Distiller Phase 2 Validation
on:
  push:
    branches: [phase2-validator-run]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator fixture suite
        run: python3 docs/distiller/validation/run_fixture_tests.py
      - name: Validate successful Phase 1 batch unchanged
        run: |
          python3 docs/distiller/validation/validate_distillation.py \
            docs/distiller/evaluation/phase1/independent/invocation-1/field-authority.json \
            docs/distiller/evaluation/phase1/independent/invocation-1/offline-runtime-split.json \
            docs/distiller/evaluation/phase1/independent/invocation-1/validation-demo-contract.json \
            docs/distiller/evaluation/phase1/independent/invocation-1/resource-loading-investigation.json \
            docs/distiller/evaluation/phase1/independent/invocation-1/deployed-ui-failure.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-b/field-authority.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-b/offline-runtime-split.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-b/validation-demo-contract.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-b/resource-loading-investigation.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-b/deployed-ui-failure.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-c/field-authority.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-c/offline-runtime-split.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-c/validation-demo-contract.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-c/resource-loading-investigation.json \
            docs/distiller/evaluation/phase1/independent/invocation-20260817-c/deployed-ui-failure.json
