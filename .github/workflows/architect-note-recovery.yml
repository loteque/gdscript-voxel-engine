name: Architect note recovery

on:
  push:
    branches:
      - pems-mapping-reconciliation
    paths:
      - .github/workflows/architect-note-recovery.yml

permissions:
  contents: write

jobs:
  append-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pems-mapping-reconciliation
          fetch-depth: 1

      - name: Append verified Architect note
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import subprocess
          from pathlib import Path

          file_path = Path("docs/handoff/architect_notes.md")
          workflow_path = Path(".github/workflows/architect-note-recovery.yml")
          expected_blob = "ce0036d1a68953b58bb882cdb3d02af3fb6b419f"
          note_id = "ARCH-20260815T193249-0700-025"
          note_b64 = ""

          actual_blob = subprocess.check_output(["git", "hash-object", str(file_path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f"Refusing append: expected {expected_blob}, found {actual_blob}")

          before = file_path.read_bytes()
          marker = f"## {note_id}\n".encode()
          if marker in before:
              raise SystemExit(f"Refusing duplicate append: {note_id} already exists")

          note = base64.b64decode(note_b64)
          file_path.write_bytes(before + note)
          after = file_path.read_bytes()
          if after != before + note:
              raise SystemExit("append integrity failure")
          if after.count(marker) != 1:
              raise SystemExit("append integrity failure: note marker count is not exactly one")

          subprocess.run(["git", "config", "user.name", "Engineering Knowledge Systems Architect"], check=True)
          subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(file_path)], check=True)
          subprocess.run(["git", "rm", str(workflow_path)], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "Restore RGP architecture note"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:pems-mapping-reconciliation"], check=True)
          print(f"append verified: preserved {len(before)} bytes, appended {len(note)} bytes")
          PY