name: Architect PEMS2 Evidence Note

on:
  push:
    branches:
      - project-chat-handoff
    paths:
      - 'docs/handoff/pems/v2/ARCHITECT_FULL_CORPUS_NOTE_APPEND.md'
      - '.github/workflows/architect-pems2-evidence-note.yml'

permissions:
  contents: write

jobs:
  append-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          fetch-depth: 1

      - name: Verify exact source and append staged note
        shell: bash
        run: |
          set -euo pipefail
          file='docs/handoff/architect_notes.md'
          payload='docs/handoff/pems/v2/ARCHITECT_FULL_CORPUS_NOTE_APPEND.md'
          expected='a5361fad967f3cc66d5092fca601f8a4c6522ea3'
          actual="$(git hash-object "$file")"
          test "$actual" = "$expected"
          cp "$file" /tmp/architect_notes.before
          cat "$payload" >> "$file"
          before_size="$(wc -c < /tmp/architect_notes.before)"
          head -c "$before_size" "$file" | cmp -s - /tmp/architect_notes.before

      - name: Commit append-only note
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/architect_notes.md
          git diff --cached --check
          git commit -m 'docs: record architect pems2 adoption readiness'
          git push origin HEAD:project-chat-handoff
