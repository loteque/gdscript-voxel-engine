name: Reasoning Distiller P6 Local Install

on:
  push:
    branches: [project-chat-handoff]
    paths:
      - '.github/workflows/reasoning-distiller-p6-local-install.yml'
      - 'project-knowledge/project.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reasoning-distiller-p6-local-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer project
        uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bootstrap dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2

      - name: Retrieve immutable P6 package candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rd-p6
          BASE='https://raw.githubusercontent.com/loteque/reasoning-distiller/p6-package-candidate/dist/p6'
          for f in rd_install.py validate_install_package_contract.py reasoning-distiller-0.1.0.tar.gz reasoning-distiller-0.1.0.manifest.json reasoning-distiller-0.1.0.sha256; do
            curl --fail --location --silent --show-error "$BASE/$f" -o "/tmp/rd-p6/$f"
          done
          test "$(sha256sum /tmp/rd-p6/reasoning-distiller-0.1.0.tar.gz | awk '{print $1}')" = "773ab0c9a5946f69ec568aabd9a255569f9511227142baadde077f826aa6cd8a"

      - name: Materialize project package JSON for installer compatibility preflight
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          data=yaml.safe_load(Path('project-knowledge/project.yaml').read_text(encoding='utf-8'))
          Path('/tmp/rd-p6/project-package.json').write_text(json.dumps(data, sort_keys=True), encoding='utf-8')
          PY

      - name: Install package into consumer-managed local tree
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/rd-p6/rd_install.py \
            --package /tmp/rd-p6/reasoning-distiller-0.1.0.tar.gz \
            --manifest /tmp/rd-p6/reasoning-distiller-0.1.0.manifest.json \
            --transport-sha256 773ab0c9a5946f69ec568aabd9a255569f9511227142baadde077f826aa6cd8a \
            --target "$GITHUB_WORKSPACE" \
            --project-package /tmp/rd-p6/project-package.json \
            --source-repository loteque/reasoning-distiller \
            --source-locator 8d81967b3f93e825172d961267818238fffc7d38

      - name: Prove installed identity and project ownership boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('.reasoning-distiller/.installation/MANIFEST.json').read_text(encoding='utf-8'))
          installation=json.loads(Path('.reasoning-distiller/.installation/INSTALLATION.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.0'
          assert manifest['source_commit'] == '8d81967b3f93e825172d961267818238fffc7d38'
          assert manifest['content_identity'] == 'sha256:ee0df2a91316ed0fa803d690b3e1b5bf6e07a320319255458e68ed1fb02b2dad'
          assert installation['content_identity'] == manifest['content_identity']
          assert Path('project-knowledge/project.yaml').is_file()
          assert Path('docs/project-chat-handoff.json').is_file()
          assert not any(str(p).startswith('.reasoning-distiller/project-knowledge') for p in Path('.reasoning-distiller').rglob('*'))
          print('PASS local package identity and ownership boundary')
          PY

      - name: Validate installed runtime from local paths only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rd-netblock
          cat > /tmp/rd-netblock/sitecustomize.py <<'PY'
          import socket
          def blocked(*args, **kwargs):
              raise RuntimeError('network disabled during P6 local runtime proof')
          socket.create_connection = blocked
          socket.getaddrinfo = blocked
          socket.socket.connect = blocked
          PY
          export PYTHONPATH=/tmp/rd-netblock
          python .reasoning-distiller/backends/pems-cove/validate_pems2_contract.py --candidate docs/project-chat-handoff.json
          python .reasoning-distiller/validators/rgp_validator.py docs/handoff/rgp/submissions/RGP-20260817T101500-0700-009.json
          python .reasoning-distiller/admission/test_admission_transaction_v2.py

      - name: Commit exact installed snapshot to project branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin project-chat-handoff
          test "$(git rev-parse refs/remotes/origin/project-chat-handoff)" = "$GITHUB_SHA" || { echo 'branch moved before package install commit' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .reasoning-distiller
          git diff --cached --quiet && { echo 'local package already installed'; exit 0; }
          git commit -m 'Install Reasoning Distiller 0.1.0 package locally'
          git push origin HEAD:project-chat-handoff
