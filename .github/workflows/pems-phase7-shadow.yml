name: PEMS Phase 7 Shadow Validation

on:
  push:
    branches:
      - phase7-shadow-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase7-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out canonical handoff branch
        uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          path: governance
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r tools/pems/requirements.txt -r tools/cove/requirements.txt

      - name: Run Phase 7 focused and regression tests
        run: |
          python -m pytest -q \
            tests/test_pems_phase7_shadow.py \
            tests/test_pems_current_handoff_import.py \
            tests/test_pems_cove_conformance.py

      - name: Verify real changed-state Steward reconciliation and generate shadow evidence
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_SOURCE_COMMIT="18ece6c5791da00ff5c14eb79172cf6d7fea5860"
          CURRENT_SOURCE_COMMIT="ff2718a00b3a267407beb446607ea6eeb664e66e"
          PREVIOUS_BLOB="7f848c9259c63d8095a4b310bcfe6fab11495a88"
          CURRENT_BLOB="e54e268cdd4fc4dad9a340c5a19958b734a74186"

          test "$(git -C governance rev-parse HEAD)" = "$CURRENT_SOURCE_COMMIT"
          test "$(git -C governance rev-parse "$PREVIOUS_SOURCE_COMMIT:docs/project-chat-handoff.json")" = "$PREVIOUS_BLOB"
          test "$(git -C governance rev-parse "$CURRENT_SOURCE_COMMIT:docs/project-chat-handoff.json")" = "$CURRENT_BLOB"

          git -C governance show "$PREVIOUS_SOURCE_COMMIT:docs/project-chat-handoff.json" > phase7-before.json
          git -C governance show "$CURRENT_SOURCE_COMMIT:docs/project-chat-handoff.json" > phase7-after.json

          python -m tools.pems.shadow_validate \
            "phase7-before-changed-state:${PREVIOUS_SOURCE_COMMIT}:phase7-before.json" \
            "phase7-after-changed-state:${CURRENT_SOURCE_COMMIT}:phase7-after.json" \
            --output phase7-shadow-report.json

          python - <<'PY'
          import json
          from pathlib import Path
          from tools.pems.import_current_handoff import import_handoff

          before = json.loads(Path('phase7-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('phase7-after.json').read_text(encoding='utf-8'))
          report = json.loads(Path('phase7-shadow-report.json').read_text(encoding='utf-8'))

          assert before['repository_snapshot']['main_commit_sha'] == after['repository_snapshot']['main_commit_sha'] == '1f72f8d61e0799cf94a5dedb3953d533068bf502'
          assert before['generated_at'] == '2026-08-13T13:08:00-07:00'
          assert after['generated_at'] == '2026-08-13T21:09:00-07:00'
          assert report['authority'] == 'noncanonical_evidence'
          assert len(report['observations']) == 2

          transition = report['transitions'][0]
          assert transition['source_changed'] is True
          assert transition['source_observation_changed'] is True
          assert transition['canonical_bytes_stable_when_source_unchanged'] is None
          assert transition['human_export_stable_when_source_unchanged'] is None
          assert len(transition['stable_candidate_ids']) == 136
          assert len(transition['added_candidate_ids']) == 6
          assert len(transition['removed_candidate_ids']) == 2
          assert transition['expanded_byte_delta'] == 2183
          assert transition['compact_byte_delta'] == 1390

          old_import = import_handoff(before, source_commit='18ece6c5791da00ff5c14eb79172cf6d7fea5860')
          new_import = import_handoff(after, source_commit='ff2718a00b3a267407beb446607ea6eeb664e66e')
          old_records = {record['id']: record for record in old_import.document['records']}
          new_records = {record['id']: record for record in new_import.document['records']}

          steward_chat_ids = [
              record_id for record_id, record in old_records.items()
              if record['kind'] == 'chat' and record['data']['title'] == 'Project Engineering Steward / Handoff Memory'
          ]
          assert len(steward_chat_ids) == 1
          steward_chat_id = steward_chat_ids[0]
          assert steward_chat_id in new_records
          assert old_records[steward_chat_id]['data']['summary'] != new_records[steward_chat_id]['data']['summary']
          assert 'Phase 7 longitudinal shadow validation is authorized and in progress' in new_records[steward_chat_id]['data']['summary']

          new_decision_summaries = {
              record['data']['summary'] for record in new_records.values()
              if record['kind'] == 'decision'
          }
          expected_new_decisions = {
              'PEMS/COVE v1 is the frozen engineering-memory representation contract; jcs/1 is the accepted deterministic byte contract and remains independently versioned.',
              'The Phase 6 importer is accepted as deterministic one-way evidence; importer-generated semantic IDs remain provisional until Steward admission.',
              'Phase 7 shadow artifacts are noncanonical evidence. docs/project-chat-handoff.json remains authoritative until a separate Phase 8 owner/Steward adoption decision.',
              'History-sensitive repository writes require complete verified source state, one immutable source identity, optimistic concurrency, and post-write verification; placeholders and partial replacements are prohibited.',
          }
          assert expected_new_decisions <= new_decision_summaries
          assert len(new_import.provisional_ids) == len(new_import.document['records'])

          structured_delta = after['project_level']['engineering_memory']['representation_workstream']
          assert structured_delta['phase7_status'] == 'authorized_in_progress'
          assert not any(record['data'] == structured_delta for record in new_import.document['records'])

          print(json.dumps(report, indent=2, sort_keys=True))
          print('PHASE7_STRUCTURED_ENGINEERING_MEMORY_DIRECT_MAPPING=false')
          PY

      - name: Upload Phase 7 changed-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase7-shadow-changed-state-evidence
          path: |
            phase7-before.json
            phase7-after.json
            phase7-shadow-report.json

      - name: Append durable Architect Phase 7 completion record
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_NOTES_BLOB="eca55c33500186502cec68bfa3375a4cd1c12eba"
          git -C governance pull --ff-only origin project-chat-handoff
          test "$(git -C governance rev-parse HEAD:docs/handoff/architect_notes.md)" = "$EXPECTED_NOTES_BLOB"
          grep -q '^## ARCH-20260813T220800-0700-014$' docs/handoff/pems/phase7-architect-completion-note.md
          cat docs/handoff/pems/phase7-architect-completion-note.md >> governance/docs/handoff/architect_notes.md
          git -C governance config user.name "loteque"
          git -C governance config user.email "69282314+loteque@users.noreply.github.com"
          git -C governance add docs/handoff/architect_notes.md
          git -C governance diff --cached --check
          git -C governance commit -m "Record Architect Phase 7 completion"
          git -C governance push origin HEAD:project-chat-handoff
          NEW_BLOB="$(git -C governance rev-parse HEAD:docs/handoff/architect_notes.md)"
          test "$NEW_BLOB" != "$EXPECTED_NOTES_BLOB"
          tail -n 120 governance/docs/handoff/architect_notes.md | grep -q 'ARCH-20260813T220800-0700-014'
          tail -n 120 governance/docs/handoff/architect_notes.md | grep -q 'Phase 8 canonical adoption remains unauthorized'
          echo "ARCHITECT_NOTES_COMMIT=$(git -C governance rev-parse HEAD)"
          echo "ARCHITECT_NOTES_BLOB=$NEW_BLOB"
