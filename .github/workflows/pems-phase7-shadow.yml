name: PEMS Phase 7 Shadow Validation

on:
  push:
    branches:
      - phase7-shadow-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out canonical handoff branch
        uses: actions/checkout@v4
        with:
          ref: project-chat-handoff
          path: governance
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r tools/pems/requirements.txt -r tools/cove/requirements.txt

      - name: Run Phase 7 focused and regression tests
        run: |
          python -m pytest -q \
            tests/test_pems_phase7_shadow.py \
            tests/test_pems_current_handoff_import.py \
            tests/test_pems_cove_conformance.py

      - name: Verify Steward no-change reconciliation and generate shadow evidence
        shell: bash
        run: |
          set -euo pipefail
          git -C governance fetch origin main
          MAIN_SHA="$(git -C governance rev-parse origin/main)"
          HANDOFF_SOURCE_COMMIT="$(git -C governance log -1 --format=%H -- docs/project-chat-handoff.json)"
          RECORDED_MAIN_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('governance/docs/project-chat-handoff.json').read_text(encoding='utf-8'))
          print(doc['repository_snapshot']['main_commit_sha'])
          PY
          )"
          test "$MAIN_SHA" = "$RECORDED_MAIN_SHA"

          python -m tools.pems.shadow_validate \
            "phase7-observation-1:${HANDOFF_SOURCE_COMMIT}:governance/docs/project-chat-handoff.json" \
            "phase7-observation-2-no-change:${HANDOFF_SOURCE_COMMIT}:governance/docs/project-chat-handoff.json" \
            --output phase7-shadow-report.json

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('phase7-shadow-report.json').read_text(encoding='utf-8'))
          assert report['authority'] == 'noncanonical_evidence'
          assert len(report['observations']) == 2
          transition = report['transitions'][0]
          assert transition['source_changed'] is False
          assert transition['canonical_bytes_stable_when_source_unchanged'] is True
          assert transition['human_export_stable_when_source_unchanged'] is True
          assert transition['added_candidate_ids'] == []
          assert transition['removed_candidate_ids'] == []
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload Phase 7 no-change evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase7-shadow-no-change-evidence
          path: phase7-shadow-report.json
